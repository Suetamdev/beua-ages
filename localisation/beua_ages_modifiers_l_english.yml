 # Age Monsters Initial Bonuses
 beua_ages_monsters_bonus_eborthil_ship_trade:0 "Masters of Shipbuilding"
 beua_ages_monsters_bonus_decentralize_anbennar:0 "Decentralization Efforts"

 # Age Monsters Threshold Bonuses
 beua_ages_monsters_threshold_bonuses_3:0 "Rising Dominance"
 beua_ages_monsters_threshold_bonuses_3_desc:0 "The turmoil of this age has created opportunities for the bold. Whether through conquest, diplomacy, or sheer determination, our realm has begun to establish itself as a force that cannot be ignored."
 beua_ages_monsters_threshold_bonuses_6:0 "Forged in Conflict"
 beua_ages_monsters_threshold_bonuses_6_desc:0 "The constant struggles of this age have tempered our nation. Every challenge overcome has strengthened our institutions, our people, and our claim to greatness in a world where only the strong endure."
 beua_ages_monsters_threshold_bonuses_9:0 "Masters of the Age"
 beua_ages_monsters_threshold_bonuses_9_desc:0 "Few can rival the influence our realm now commands. Through strength, ambition, and perseverance, we have shaped the course of this turbulent age, leaving a legacy that will endure long after its conflicts have faded."
 
 # Age Unraveling Initial Bonuses
 beua_ages_unraveling_bonus_corinite_crusaders:0 "Corinite Crusaders"
 beua_ages_unraveling_bonus_elven_reclaimers:0 "Elven Reclaimers"

 # Age Unraveling Threshold Bonuses
 beua_ages_unraveling_threshold_bonuses_3:0 "Threads Unraveling"
 beua_ages_unraveling_threshold_bonuses_3_desc:0 "The foundations of the old order have begun to fray. Faiths clash, ancient certainties are questioned, and distant horizons draw the ambitious forward. Amid the growing upheaval, our realm has begun to find its place in the world taking shape."
 beua_ages_unraveling_threshold_bonuses_6:0 "Shattered Certainties"
 beua_ages_unraveling_threshold_bonuses_6_desc:0 "What once seemed eternal now lies broken or transformed. Religious upheaval, expanding frontiers, and the return of forgotten powers have reshaped the world around us. Rather than be swept aside by these changes, our nation has learned to thrive among them."
 beua_ages_unraveling_threshold_bonuses_9:0 "Weavers of a New Age"
 beua_ages_unraveling_threshold_bonuses_9_desc:0 "The threads binding the old world have come undone, yet from their remnants a new order is being woven. Through faith, ambition, discovery, and strength, our realm has risen beyond merely enduring the Unraveling—we now stand among those who will determine what follows."

 # Age Witchkings Initial Bonuses
 beua_ages_witchkings_bonus_dwarovar_rebirth:0 "Dwarovar Rebirth"

 # Age Witchkings Threshold Bonuses
 beua_ages_witchkings_threshold_bonuses_3:0 "Consolidation of Power"
 beua_ages_witchkings_threshold_bonuses_3_desc:0 "The foundations of enduring rule have been laid. Whether through ancient bloodlines, republican tradition, divine mandate, or magical authority, our government commands unquestioned legitimacy, allowing the realm to weather any challenge with unwavering stability."
 beua_ages_witchkings_threshold_bonuses_6:0 "Unyielding Dominion"
 beua_ages_witchkings_threshold_bonuses_6_desc:0 "Our authority now reaches every corner of the realm. Loyal subjects, disciplined armies, and an incorruptible administration ensure that no internal weakness can threaten the strength of our dominion."
 beua_ages_witchkings_threshold_bonuses_9:0 "Imperium Eternal"
 beua_ages_witchkings_threshold_bonuses_9_desc:0 "Our realm has become the embodiment of absolute rule. Revered by allies, feared by rivals, and guided by an unshakable government, our empire stands among the defining powers of the Age of Witch-Kings, destined to shape the course of history."
 
 # Age Artificers Initial Bonuses
 beua_ages_artificers_bonus_orcish_nation:0 "Orcish Nation"
 beua_ages_artificers_bonus_anbennarian_resurgence:0 "Anbennarian Resurgence" 

 # Age Artificers Threshold Bonuses
 beua_ages_artificers_threshold_bonuses_3:0 "Age of Innovation"
 beua_ages_artificers_threshold_bonuses_3_desc:0 "The discoveries of generations have begun to bear fruit. Workshops hum with invention, scholars push beyond the limits of established knowledge, and artificers transform once-impossible ideas into practical reality. Our nation stands at the forefront of a new era of progress."
 beua_ages_artificers_threshold_bonuses_6:0 "Industrial Ascendancy"
 beua_ages_artificers_threshold_bonuses_6_desc:0 "Innovation now shapes every aspect of our realm. Vast foundries, advanced infrastructure, and disciplined administration sustain an economy capable of supporting armies, fleets, and cities on a scale unseen in previous ages. Prosperity and power reinforce one another."
 beua_ages_artificers_threshold_bonuses_9:0 "Masters of the New Era"
 beua_ages_artificers_threshold_bonuses_9_desc:0 "The future belongs to those who dare to redefine it. Through unrivaled technological achievement, artificery, and enlightened governance, our nation has risen above the struggles of the past. The world no longer merely adapts to change—it follows the course that we have set."

